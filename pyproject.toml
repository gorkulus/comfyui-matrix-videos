[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-matrix-videos"
version = "0.1.0"
description = "Render labeled matrix-review videos from ComfyUI batch manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gorkulus and contributors" }]
dependencies = ["Pillow>=10.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/gorkulus/comfyui-matrix-videos"
Issues = "https://github.com/gorkulus/comfyui-matrix-videos/issues"

[project.scripts]
comfy-matrix-video = "comfyui_matrix_videos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfyui_matrix_videos = ["py.typed"]
